name: Daily Steam Market Scrape

on:
  schedule:
    - cron: '0 6 * * *'   # codziennie o 06:00 UTC
  workflow_dispatch:      # umożliwia ręczne uruchomienie

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run scraper
        run: python scraper/scrape.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/items.json
          git diff --staged --quiet || (git commit -m "Auto-update market data $(date -u +'%Y-%m-%d %H:%M UTC')" && git push)
